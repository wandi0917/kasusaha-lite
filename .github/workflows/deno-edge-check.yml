name: KasUsaha Lite Deno Edge Function checks

on:
  push:
    branches:
      - main
      - "sync/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-check:
    name: Type-check deployed Edge Function sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check all Edge Functions
        run: deno check supabase/functions/*/index.ts
      - name: Run application regression checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate application safeguards
        run: node scripts/validate-app.mjs
