name: KasUsaha Lite navigation browser tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/playwright-test-current-pr-20261108]
  workflow_dispatch:

jobs:
  navigation-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Test
        run: |
          npm init -y
          npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local server from the checked-out commit
        run: |
          python3 -m http.server 4173 --directory . > /tmp/kasusaha-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kasusaha-http.log
          exit 1
      - name: Test desktop and mobile navigation against this commit
        env:
          KASUSAHA_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test
