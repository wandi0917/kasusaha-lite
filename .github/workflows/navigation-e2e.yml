name: KasUsaha Lite navigation browser tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/navigation-serialization-20261108]

jobs:
  navigation-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Test
        run: |
          npm init -y
          npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile navigation
        env:
          KASUSAHA_BASE_URL: https://fix-navigation-serialization.kasusaha-lite.pages.dev
        run: npx playwright test
