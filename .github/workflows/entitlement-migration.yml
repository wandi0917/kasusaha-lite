name: KasUsaha Lite entitlement migration regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  entitlement-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run isolated entitlement migration regression
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f scripts/test-entitlement-migration.sql \
            -f supabase/migrations/20261114100000_preserve_disabled_plan_entitlements.sql \
            -f scripts/assert-entitlement-migration.sql
