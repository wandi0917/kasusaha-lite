name: License partner integration checks

on:
  push:
    branches: [feat/license-partner-commission-integration]
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "supabase/functions/create-marketplace-order/**"
      - "supabase/functions/midtrans-webhook/**"
      - "supabase/functions/platform-license-partners/**"
      - "supabase/functions/license-partner-apply/**"
      - "supabase/migrations/*license_partner*"

jobs:
  deno-check-new-endpoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check new partner administration endpoints
        run: |
          deno check supabase/functions/platform-license-partners/index.ts
          deno check supabase/functions/license-partner-apply/index.ts
