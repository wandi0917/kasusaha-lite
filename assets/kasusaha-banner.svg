<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="bannerTitle bannerDesc">
<title id="bannerTitle">KasUsaha Lite — Cara memasang di HP atau laptop</title>
<desc id="bannerDesc">Banner berwarna biru dan ungu dengan ilustrasi perempuan profesional, ponsel Android, dan laptop yang menampilkan aplikasi KasUsaha Lite. Klik untuk melihat panduan pemasangan.</desc>
